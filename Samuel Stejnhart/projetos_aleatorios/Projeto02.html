<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ARQUIVO // Sistema Paranormal</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap');

:root{
    --bg:#070809;
    --bg2:#0c0e10;
    --panel:#111416;
    --panel2:#171a1d;
    --panel3:#1c2024;
    --border:#292e33;
    --border2:#3a4046;
    --text:#eeeeee;
    --muted:#858d93;
    --muted2:#596167;
    --red:#b51f2d;
    --red2:#e12b3b;
    --red3:#6f151d;
    --green:#43bd88;
    --yellow:#d2a63a;
    --blue:#518bd8;
    --purple:#9a68d6;
    --shadow:0 18px 55px rgba(0,0,0,.42);
    --radius:3px;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(
            circle at 50% -15%,
            rgba(180,20,35,.19),
            transparent 35%
        ),
        radial-gradient(
            circle at 100% 100%,
            rgba(80,20,30,.08),
            transparent 30%
        ),
        #070809;
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9999;
    opacity:.025;
    background:
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 3px,
            white 4px
        );
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

input,
textarea,
select{
    color:#eee;
    background:#090b0c;
    border:1px solid var(--border2);
    outline:none;
    border-radius:2px;
    transition:.18s;
}

input:focus,
textarea:focus,
select:focus{
    border-color:var(--red);
    box-shadow:0 0 0 2px rgba(181,31,45,.1);
}

input{
    padding:10px 11px;
}

textarea{
    width:100%;
    min-height:120px;
    resize:vertical;
    padding:11px;
}

select{
    width:100%;
    padding:10px 11px;
}

option{
    background:#101214;
}

/* =========================
   GLOBAL
========================= */

.hidden{
    display:none!important;
}

.app{
    min-height:100vh;
}

.screen{
    display:none;
}

.screen.active{
    display:block;
}

.container{
    max-width:1500px;
    margin:auto;
    padding:28px;
}

.eyebrow{
    color:var(--red2);
    font-family:"Barlow Condensed",sans-serif;
    font-size:13px;
    font-weight:800;
    letter-spacing:2.5px;
    text-transform:uppercase;
}

h1,h2,h3,h4{
    font-family:"Barlow Condensed",sans-serif;
}

.page-title{
    margin:4px 0 0;
    font-size:44px;
    line-height:1;
    letter-spacing:1px;
}

.subtitle{
    color:var(--muted);
    margin-top:8px;
    font-size:13px;
}

.btn{
    border:1px solid var(--border2);
    background:#15181b;
    color:#ddd;
    padding:10px 13px;
    font-size:11px;
    font-weight:800;
    letter-spacing:.5px;
    text-transform:uppercase;
    border-radius:2px;
    transition:.18s;
}

.btn:hover{
    background:#202428;
    border-color:#555c62;
    transform:translateY(-1px);
}

.btn.primary{
    color:#fff;
    background:linear-gradient(
        180deg,
        #a51c29,
        #79131c
    );
    border-color:#bc2734;
}

.btn.primary:hover{
    background:#b6202d;
}

.btn.danger{
    color:#ff777f;
    border-color:#4c2025;
    background:#180d0f;
}

.btn.green{
    color:#9cf0ca;
    border-color:#245540;
    background:#0d1b15;
}

.btn.small{
    padding:7px 9px;
    font-size:10px;
}

.icon-btn{
    width:35px;
    height:35px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--border);
    background:#121517;
    color:#aaa;
}

.icon-btn:hover{
    color:white;
    border-color:var(--red);
}

/* =========================
   LANDING
========================= */

#screen-home{
    min-height:100vh;
    background:
        linear-gradient(
            rgba(7,8,9,.75),
            rgba(7,8,9,.96)
        ),
        radial-gradient(
            circle at 50% 35%,
            rgba(130,15,25,.14),
            transparent 45%
        );
}

.home-header{
    padding:25px 30px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.brand-mark{
    width:45px;
    height:45px;
    border:1px solid #8b1e29;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--red2);
    font-family:"Barlow Condensed";
    font-size:25px;
    font-weight:900;
}

.brand-name{
    font-family:"Barlow Condensed";
    font-size:25px;
    font-weight:900;
    letter-spacing:2px;
}

.brand-sub{
    color:#646c71;
    font-size:9px;
    letter-spacing:2px;
}

.home-main{
    max-width:1250px;
    margin:auto;
    padding:70px 25px;
}

.home-hero{
    text-align:center;
    margin-bottom:55px;
}

.home-hero h1{
    font-size:75px;
    margin:5px 0;
    letter-spacing:5px;
}

.home-hero h1 span{
    color:var(--red2);
}

.home-hero p{
    color:#737b81;
    font-size:13px;
    letter-spacing:1px;
}

.agent-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.agent-toolbar h2{
    font-size:25px;
    margin:0;
}

.agent-count{
    color:#5e666c;
    font-size:11px;
}

.agent-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(245px,1fr));
    gap:13px;
}

.agent-card{
    min-height:230px;
    border:1px solid var(--border);
    background:
        linear-gradient(
            135deg,
            rgba(160,20,35,.08),
            transparent 55%
        ),
        #101315;
    padding:15px;
    position:relative;
    overflow:hidden;
    transition:.2s;
}

.agent-card:hover{
    border-color:#5c252b;
    transform:translateY(-2px);
    box-shadow:var(--shadow);
}

.agent-card-photo{
    width:65px;
    height:65px;
    border:1px solid #3b4146;
    background:#090a0b;
    float:left;
    margin-right:13px;
    overflow:hidden;
}

.agent-card-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.agent-card-placeholder{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#454c51;
    font-family:"Barlow Condensed";
    font-size:25px;
}

.agent-card h3{
    margin:2px 0 3px;
    font-size:22px;
}

.agent-card .codename{
    color:var(--red2);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.agent-card-info{
    clear:both;
    padding-top:17px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
}

.mini-stat{
    background:#0b0d0f;
    border:1px solid #24292d;
    padding:7px;
}

.mini-stat small{
    display:block;
    color:#5c646a;
    font-size:8px;
    text-transform:uppercase;
}

.mini-stat strong{
    font-family:"Barlow Condensed";
    font-size:17px;
}

.agent-card-actions{
    display:flex;
    gap:5px;
    margin-top:12px;
}

.agent-card-actions button{
    flex:1;
}

.empty-state{
    grid-column:1/-1;
    padding:60px 20px;
    border:1px dashed #353b40;
    text-align:center;
    color:#646c71;
}

.empty-state strong{
    display:block;
    font-family:"Barlow Condensed";
    font-size:30px;
    color:#8a9196;
    margin-bottom:6px;
}

/* =========================
   WORKSPACE
========================= */

.workspace{
    display:flex;
    min-height:100vh;
}

.sidebar{
    width:250px;
    flex-shrink:0;
    background:#0a0c0e;
    border-right:1px solid var(--border);
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:50;
    padding:17px 13px;
}

.sidebar-logo{
    border:1px solid #353a3e;
    padding:13px;
    margin-bottom:20px;
    background:
        linear-gradient(
            135deg,
            rgba(170,20,35,.12),
            transparent
        );
}

.sidebar-logo strong{
    font-family:"Barlow Condensed";
    font-size:25px;
    letter-spacing:2px;
}

.sidebar-logo strong span{
    color:var(--red2);
}

.sidebar-logo small{
    display:block;
    color:#555d63;
    font-size:8px;
    letter-spacing:1.8px;
    margin-top:3px;
}

.nav-label{
    color:#4d555b;
    font-size:9px;
    letter-spacing:2px;
    font-weight:800;
    margin:17px 9px 6px;
}

.nav-btn{
    width:100%;
    border:0;
    border-left:2px solid transparent;
    background:transparent;
    color:#858d92;
    text-align:left;
    padding:11px 10px;
    margin-bottom:2px;
    font-size:11px;
    font-weight:700;
    transition:.16s;
}

.nav-btn:hover{
    background:#15181b;
    color:#eee;
}

.nav-btn.active{
    background:#181b1e;
    border-left-color:var(--red2);
    color:#fff;
}

.nav-icon{
    display:inline-block;
    width:23px;
    color:#596168;
}

.sidebar-bottom{
    position:absolute;
    bottom:17px;
    left:13px;
    right:13px;
}

.main{
    width:calc(100% - 250px);
    margin-left:250px;
}

.topbar{
    height:67px;
    background:rgba(9,11,12,.92);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(12px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    position:sticky;
    top:0;
    z-index:40;
}

.current-file{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:0;
}

.file-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 10px var(--green);
}

.current-file span{
    font-size:11px;
    color:#a1a7ab;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.top-actions{
    display:flex;
    gap:6px;
}

/* =========================
   WORKSPACE PAGES
========================= */

.workspace-page{
    display:none;
}

.workspace-page.active{
    display:block;
}

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    margin-bottom:22px;
}

.header-actions{
    display:flex;
    gap:6px;
}

.panel{
    border:1px solid var(--border);
    background:
        linear-gradient(
            145deg,
            #121517,
            #0f1113
        );
    box-shadow:0 10px 30px rgba(0,0,0,.18);
    margin-bottom:15px;
}

.panel-header{
    min-height:43px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 13px;
}

.panel-header h3{
    margin:0;
    color:#d6dadd;
    font-size:16px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.panel-header small{
    color:#555e64;
    font-size:9px;
}

.panel-body{
    padding:15px;
}

.grid{
    display:grid;
    gap:10px;
}

.g2{
    grid-template-columns:repeat(2,1fr);
}

.g3{
    grid-template-columns:repeat(3,1fr);
}

.g4{
    grid-template-columns:repeat(4,1fr);
}

.g5{
    grid-template-columns:repeat(5,1fr);
}

.field label{
    display:block;
    margin-bottom:5px;
    color:#656e74;
    font-size:9px;
    font-weight:800;
    letter-spacing:1.2px;
    text-transform:uppercase;
}

.field.full{
    grid-column:1/-1;
}

/* =========================
   CHARACTER
========================= */

.identity{
    display:grid;
    grid-template-columns:180px 1fr;
    gap:18px;
}

.portrait{
    width:180px;
    height:220px;
    background:#090a0b;
    border:1px solid #383e43;
    position:relative;
    overflow:hidden;
}

.portrait img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.portrait-empty{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:#3f464b;
    font-family:"Barlow Condensed";
    letter-spacing:2px;
}

.portrait-empty b{
    font-size:58px;
    color:#252a2e;
}

.photo-upload{
    position:absolute;
    left:7px;
    right:7px;
    bottom:7px;
}

.photo-upload label{
    display:block;
    padding:8px;
    background:rgba(7,8,9,.9);
    border:1px solid #41474c;
    text-align:center;
    cursor:pointer;
    color:#bbb;
    font-size:9px;
    font-weight:800;
}

.photo-upload input{
    display:none;
}

.resource-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin-top:11px;
}

.resource{
    background:#0a0c0e;
    border:1px solid #292e33;
    padding:11px;
}

.resource-title{
    color:#7e878d;
    font-family:"Barlow Condensed";
    text-transform:uppercase;
    letter-spacing:1px;
    font-size:13px;
    margin-bottom:7px;
}

.resource-inputs{
    display:grid;
    grid-template-columns:1fr 12px 1fr;
    gap:5px;
    align-items:center;
}

.resource-inputs input{
    text-align:center;
    font-weight:800;
    font-size:20px;
}

.resource-inputs span{
    text-align:center;
    color:#4b5358;
}

.progress{
    height:4px;
    background:#202428;
    margin-top:8px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    background:var(--red2);
    width:50%;
    transition:.3s;
}

.progress-bar.pe{
    background:var(--blue);
}

.progress-bar.san{
    background:var(--purple);
}

.attributes{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:9px;
}

.attribute{
    border:1px solid #2c3136;
    background:#0b0d0f;
    padding:12px;
    text-align:center;
}

.attribute-name{
    font-family:"Barlow Condensed";
    color:#a5abb0;
    font-size:13px;
    letter-spacing:1px;
}

.attribute input{
    margin-top:7px;
    width:100%;
    text-align:center;
    font-family:"Barlow Condensed";
    font-size:31px;
    font-weight:900;
}

/* =========================
   SKILLS
========================= */

.skills-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    column-gap:30px;
}

.skill{
    display:grid;
    grid-template-columns:22px 1fr 75px;
    gap:7px;
    align-items:center;
    min-height:39px;
    border-bottom:1px solid #202529;
}

.skill input[type=checkbox]{
    width:15px;
    height:15px;
    accent-color:var(--red2);
}

.skill-name{
    color:#c4c9cc;
    font-size:11px;
}

.skill-attr{
    display:block;
    color:#535b61;
    font-size:8px;
    margin-top:1px;
}

.skill input[type=number]{
    padding:6px;
    text-align:center;
}

/* =========================
   COMBAT
========================= */

.combat-layout{
    display:grid;
    grid-template-columns:1fr 1.4fr;
    gap:15px;
}

.combat-stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.combat-stat{
    background:#0a0c0e;
    border:1px solid #2b3035;
    padding:13px;
}

.combat-stat small{
    color:#5e676d;
    font-size:8px;
    display:block;
    text-transform:uppercase;
}

.combat-stat strong{
    display:block;
    font-family:"Barlow Condensed";
    font-size:28px;
    margin-top:3px;
}

.weapon-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.weapon-card{
    border:1px solid #2d3338;
    background:#0b0d0f;
    padding:11px;
}

.weapon-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.weapon-name{
    font-family:"Barlow Condensed";
    font-size:18px;
}

.weapon-meta{
    color:#646d73;
    font-size:9px;
}

.weapon-description{
    color:#858d92;
    font-size:11px;
    line-height:1.5;
    margin-top:6px;
}

/* =========================
   INVENTORY
========================= */

.inventory-grid{
    display:grid;
    grid-template-columns:1.4fr 1fr;
    gap:15px;
}

.inventory-row{
    display:grid;
    grid-template-columns:1fr 90px 80px 38px;
    gap:6px;
    margin-bottom:6px;
}

.load-box{
    text-align:center;
    padding:25px;
    border:1px solid #2d3338;
    background:#0a0c0e;
}

.load-number{
    font-family:"Barlow Condensed";
    font-size:55px;
    color:#ddd;
}

.load-label{
    color:#5c656b;
    font-size:9px;
    text-transform:uppercase;
}

/* =========================
   ABILITIES / RITUALS
========================= */

.entry{
    border:1px solid #2c3237;
    background:#0b0d0f;
    padding:12px;
    margin-bottom:7px;
}

.entry-head{
    display:grid;
    grid-template-columns:1fr 100px 38px;
    gap:6px;
}

.entry textarea{
    min-height:65px;
    margin-top:6px;
}

.entry-tag{
    color:var(--red2);
    font-size:9px;
    font-weight:800;
    text-transform:uppercase;
}

/* =========================
   HISTORY
========================= */

.story-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

/* =========================
   CREATURES
========================= */

.creature-layout{
    display:grid;
    grid-template-columns:360px 1fr;
    gap:15px;
}

.creature-list{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.creature-select{
    border:1px solid #2a3035;
    background:#0b0d0f;
    padding:11px;
    cursor:pointer;
    transition:.15s;
}

.creature-select:hover{
    border-color:#5a252c;
}

.creature-select.selected{
    border-left:2px solid var(--red2);
    background:#181214;
}

.creature-select strong{
    display:block;
    font-family:"Barlow Condensed";
    font-size:17px;
}

.creature-select span{
    color:#656e74;
    font-size:9px;
}

.threat-banner{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px;
    border:1px solid #4b2026;
    background:
        linear-gradient(
            135deg,
            rgba(180,25,40,.14),
            transparent
        ),
        #100e0f;
    margin-bottom:10px;
}

.threat-name{
    font-family:"Barlow Condensed";
    font-size:30px;
}

.threat-element{
    color:var(--red2);
    font-size:9px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
}

.creature-stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
}

.creature-stat{
    text-align:center;
    padding:10px;
    background:#0a0c0e;
    border:1px solid #2a3035;
}

.creature-stat small{
    color:#5d666c;
    display:block;
    font-size:8px;
    text-transform:uppercase;
}

.creature-stat strong{
    font-family:"Barlow Condensed";
    font-size:23px;
}

.action{
    border-left:2px solid var(--red3);
    background:#0b0d0f;
    border-top:1px solid #292e33;
    border-right:1px solid #292e33;
    border-bottom:1px solid #292e33;
    padding:11px;
    margin-bottom:7px;
}

.action strong{
    font-family:"Barlow Condensed";
    font-size:18px;
}

.action .roll{
    color:var(--red2);
    font-size:10px;
    margin-left:7px;
}

.action p{
    color:#858d92;
    font-size:11px;
    line-height:1.5;
    margin:7px 0 0;
}

/* =========================
   DICE
========================= */

.dice-layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.dice-result-box{
    min-height:240px;
    background:#090b0c;
    border:1px solid #363c41;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.dice-result-label{
    color:#5f676d;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:2px;
}

.dice-result{
    font-family:"Barlow Condensed";
    font-size:90px;
    font-weight:900;
    color:white;
}

.dice-formula{
    color:#737b81;
    font-size:11px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(5px);
    z-index:500;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.open{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:550px;
    background:#121517;
    border:1px solid #41474c;
    box-shadow:0 25px 80px rgba(0,0,0,.7);
}

.modal-head{
    padding:14px 16px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-head h3{
    margin:0;
    font-size:20px;
}

.modal-body{
    padding:17px;
}

.modal-footer{
    border-top:1px solid var(--border);
    padding:12px 16px;
    display:flex;
    justify-content:flex-end;
    gap:6px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:1000;
    background:#171a1d;
    border:1px solid #42484d;
    padding:12px 16px;
    font-size:11px;
    box-shadow:var(--shadow);
    transform:translateY(100px);
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

/* =========================

========================= */

@media(max-width:1050px){

        width:220px;
    }

    }
}

    .header-actions{

    }

    .top-actions .btn{
        padding:7px;
    }

    .g3,
    .g4,
    .g5{

    }

    .creature-stats{

    }

    .inventory-row{
        grid-template-columns:1fr 60px 60px 38px;
    }

    .entry-head{
        grid-template-columns:1fr 70px 38px;
    }
}
